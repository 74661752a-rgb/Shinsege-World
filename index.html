<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>두 강, 두 랜드마크 | 아이콘시암과 부산 신세계 타운 비교 보고서</title>
<meta name="description" content="방콕 아이콘시암과 부산 신세계 타운의 유사점·차별점, 관광단지 필수조건, 벡스코와의 관계를 정리한 분석 보고서">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700;900&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 두 강, 두 랜드마크 — 분석 보고서 */
:root{
  --navy:#0a1f44; --navy-2:#13306b; --navy-3:#1d4488;
  --ink:#0f1a2c; --ink-2:#3d4b63; --muted:#5b6a82;
  --line:#d5dde9; --line-2:#e6ebf3; --bg:#f4f6fa; --paper:#fff;
  --bk:#a86a00; --bk-2:#d99200; --bk-soft:#fbf0d9;
  --bs:#0b7480; --bs-2:#17a2b0; --bs-soft:#dcf1f3;
  --ok:#17794a; --ok-soft:#dff3e8;
  --warn:#a85200; --warn-soft:#fdebd6;
  --na:#546178; --na-soft:#e9edf3;
  --serif:"Noto Serif KR","Nanum Myeongjo","Batang",serif;
  --sans:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --nav-h:60px;
  --radius:6px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:calc(var(--nav-h) + 16px)}
body{margin:0;font-family:var(--sans);color:var(--ink);background:var(--bg);line-height:1.7;font-size:16px;-webkit-font-smoothing:antialiased;font-feature-settings:"tnum"}
h1,h2,h3,h4,p,ul,ol,dl,dd,figure{margin:0}
ul,ol{padding:0;list-style:none}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--navy-3)}
:focus-visible{outline:3px solid #2f6fe4;outline-offset:2px;border-radius:3px}
.skip{position:absolute;left:-999px;top:0;background:#fff;padding:.6rem 1rem;z-index:100}
.skip:focus{left:8px;top:8px}
.wrap{width:min(1120px,100% - 40px);margin-inline:auto}
.num{font-variant-numeric:tabular-nums}

/* ── nav ── */
.nav{position:fixed;inset:0 0 auto 0;height:var(--nav-h);z-index:50;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);transform:translateY(-100%);transition:transform .3s ease}
.nav.show{transform:none}
.nav .bar{position:absolute;left:0;bottom:-1px;height:3px;background:linear-gradient(90deg,var(--bk-2),var(--navy-3),var(--bs-2));width:var(--p,0%)}
.nav .in{height:100%;display:flex;align-items:center;gap:1.5rem}
.brand{font-family:var(--serif);font-weight:900;font-size:1.05rem;color:var(--navy);text-decoration:none;white-space:nowrap}
.nav ul{display:flex;gap:.25rem;margin-left:auto;overflow-x:auto;scrollbar-width:none}
.nav ul::-webkit-scrollbar{display:none}
.nav li a{display:block;padding:.45rem .7rem;border-radius:var(--radius);color:var(--ink-2);text-decoration:none;font-size:.9rem;font-weight:500;white-space:nowrap}
.nav li a:hover{background:var(--line-2);color:var(--navy)}
.nav li a[aria-current="true"]{background:var(--navy);color:#fff}

/* ── cover ── */
.cover{min-height:100svh;background:radial-gradient(1200px 600px at 85% 110%,#17499c 0,transparent 60%),linear-gradient(160deg,#07162f 0,#0a1f44 55%,#0e2d5f 100%);color:#fff;display:flex;flex-direction:column;position:relative;overflow:hidden}
.cover .top{padding:28px 0;font-size:.9rem;color:#b8c7e3;letter-spacing:.02em}
.cover .top .wrap{display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.cover .body{flex:1;display:flex;align-items:center;position:relative;z-index:2}
.cover h1{font-family:var(--serif);font-weight:900;font-size:clamp(2.6rem,7.5vw,5.6rem);line-height:1.12;letter-spacing:-.02em;text-wrap:balance}
.cover h1 .l1{display:block}
.cover h1 .l2{display:block;color:#e8c777}
.cover .sub{margin-top:1.75rem;font-size:clamp(1.05rem,2.2vw,1.35rem);color:#d6e1f5;max-width:34em;font-weight:400}
.cover .rule{width:72px;height:4px;background:linear-gradient(90deg,var(--bk-2),var(--bs-2));margin:2rem 0 0;border-radius:2px}
.cover .meta{margin-top:2.5rem;display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,max-content));gap:.75rem 3rem;font-size:.92rem}
.cover .meta dt{color:#9fb2d4;font-size:.8rem}
.cover .meta dd{font-weight:600}
.cover .go{display:inline-flex;align-items:center;gap:.6rem;margin-top:2.75rem;padding:.9rem 1.5rem;background:#fff;color:var(--navy);font-weight:700;border-radius:999px;text-decoration:none;transition:transform .2s}
.cover .go:hover{transform:translateY(-2px)}
.cover svg.rivers{position:absolute;left:0;right:0;bottom:0;width:100%;height:46%;z-index:1;opacity:.9}
.cover .legend{position:absolute;right:max(20px,calc((100% - 1120px)/2));bottom:28px;z-index:3;display:flex;gap:1.25rem;font-size:.85rem;color:#dbe6fa}
.dot{display:inline-block;width:.7rem;height:.7rem;border-radius:50%;margin-right:.45rem;vertical-align:-1px}
.dot.bk{background:var(--bk-2)} .dot.bs{background:var(--bs-2)}
.dot.ok{background:var(--ok)} .dot.warn{background:var(--warn)} .dot.na{background:var(--na)}
@media(prefers-reduced-motion:no-preference){
  .cover h1 .l1,.cover h1 .l2,.cover .sub,.cover .meta,.cover .go{animation:rise .9s cubic-bezier(.2,.7,.2,1) both}
  .cover h1 .l2{animation-delay:.12s}.cover .sub{animation-delay:.28s}.cover .meta{animation-delay:.4s}.cover .go{animation-delay:.5s}
  .rivers .w1{animation:drift 14s ease-in-out infinite alternate}
  .rivers .w2{animation:drift 18s ease-in-out infinite alternate-reverse}
}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes drift{from{transform:translateX(-2%)}to{transform:translateX(2%)}}

/* ── toc ── */
.toc{background:var(--paper);padding:88px 0 96px;border-bottom:1px solid var(--line)}
.toc .wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:4rem}
.toc h2{font-family:var(--serif);font-size:clamp(2rem,4vw,2.8rem);font-weight:900;color:var(--navy);line-height:1.2}
.toc .lead{margin-top:1rem;color:var(--ink-2);max-width:26em}
.legendbox{margin-top:2rem;padding:1.1rem 1.25rem;border:1px solid var(--line);border-radius:var(--radius);background:var(--bg);font-size:.9rem}
.legendbox h3{font-size:.95rem;margin-bottom:.6rem;color:var(--navy)}
.legendbox li{display:flex;gap:.6rem;align-items:flex-start;padding:.2rem 0;color:var(--ink-2)}
.toc ol{counter-reset:c}
.toc ol li{border-top:1px solid var(--line)}
.toc ol li:last-child{border-bottom:1px solid var(--line)}
.toc ol a{display:grid;grid-template-columns:3.2rem 1fr auto;align-items:baseline;gap:.75rem;padding:1.05rem .25rem;text-decoration:none;color:var(--ink);transition:background .2s,padding .2s}
.toc ol a:hover{background:var(--bg);padding-inline:.9rem}
.toc .n{font-family:var(--serif);font-weight:900;font-size:1.4rem;color:var(--navy-3)}
.toc .t{font-weight:700;font-size:1.08rem}
.toc .d{display:block;font-weight:400;font-size:.9rem;color:var(--muted);margin-top:.1rem}
.toc .arrow{color:var(--muted);font-size:1.1rem}

/* ── chapters ── */
main{display:block}
.chapter{padding:84px 0 24px;background:var(--bg)}
.chapter:nth-of-type(even){background:var(--paper)}
.ch-head{display:grid;grid-template-columns:auto 1fr;gap:1.5rem 1.75rem;align-items:start;margin-bottom:2.25rem}
.ch-no{font-family:var(--serif);font-weight:900;font-size:clamp(3rem,6vw,4.6rem);line-height:.9;color:var(--navy);padding-right:1.5rem;border-right:3px solid var(--bk-2)}
.ch-head h2{font-family:var(--serif);font-weight:900;font-size:clamp(1.6rem,3.2vw,2.3rem);color:var(--navy);line-height:1.25}
.ch-head p{margin-top:.6rem;color:var(--ink-2);max-width:46em}
.chapter .wrap{padding-bottom:64px}
.note{font-size:.88rem;color:var(--muted);margin-top:1rem;max-width:62em}
.note b{color:var(--ink-2)}
.callout{margin-top:1.5rem;padding:1.1rem 1.35rem;background:#eef3fc;border-left:4px solid var(--navy-3);border-radius:0 var(--radius) var(--radius) 0}
.callout b{color:var(--navy)}
.callout.priority{background:var(--bk-soft);border-left-color:var(--bk-2)}

/* ── stats ── */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.stat{background:var(--paper);padding:1.35rem 1.4rem}
.stat b{display:block;font-family:var(--serif);font-weight:900;font-size:clamp(1.9rem,3.4vw,2.6rem);line-height:1.1;color:var(--navy);font-variant-numeric:tabular-nums}
.stat b small{font-family:var(--sans);font-size:.95rem;font-weight:600;color:var(--ink-2);margin-left:.3rem}
.stat span{display:block;margin-top:.45rem;font-size:.88rem;color:var(--muted);line-height:1.45}
.stat.ok b{color:var(--ok)} .stat.warn b{color:var(--warn)} .stat.na b{color:var(--na)}
.stats.tight{margin-bottom:1.25rem}

/* ── chips ── */
.chip{display:inline-flex;align-items:center;gap:.3rem;padding:.12rem .6rem;border-radius:999px;font-size:.8rem;font-weight:700;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.na{background:var(--na-soft);color:var(--na)}
.seg{display:inline-flex;flex-wrap:wrap;gap:.35rem;margin:0 .5rem .75rem 0}
.seg button{padding:.42rem .95rem;border:1px solid var(--line);background:var(--paper);border-radius:999px;font-size:.9rem;font-weight:600;color:var(--ink-2)}
.seg button:hover{border-color:var(--navy-3)}
.seg button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:#fff}
.toolbar{display:flex;flex-wrap:wrap;gap:.25rem 1.5rem;align-items:center;margin-bottom:.75rem}
.toolbar .count{margin-left:auto;font-size:.88rem;color:var(--muted)}

/* ── comparison table ── */
.tbl{border:1px solid var(--line);border-radius:var(--radius);background:var(--paper);overflow:hidden}
.tbl .r{display:grid;grid-template-columns:1.05fr 1.7fr 1.7fr .8fr 1.5fr;gap:0 1.1rem;padding:1rem 1.2rem;border-top:1px solid var(--line-2);align-items:start;font-size:.93rem}
.tbl .r.h{background:var(--navy);color:#fff;font-weight:700;font-size:.85rem;border-top:0}
.tbl .r.h .bk{color:#f3d58f} .tbl .r.h .bs{color:#9fe3ea}
.tbl .r:not(.h):hover{background:#f9fbfe}
.tbl .dim{font-weight:700;color:var(--navy)}
.tbl .dim small{display:block;font-weight:500;color:var(--muted);margin-top:.25rem;font-size:.78rem}
.tbl .c-bk{border-left:3px solid var(--bk-2);padding-left:.75rem}
.tbl .c-bs{border-left:3px solid var(--bs-2);padding-left:.75rem}
.tbl .why{color:var(--ink-2)}
.tbl .src{display:block;margin-top:.4rem;font-size:.78rem;color:var(--muted)}
.tbl.cols-evt .r{grid-template-columns:1.1fr 1.6fr 1.6fr 1.1fr}
.empty{padding:2rem;text-align:center;color:var(--muted)}

/* ── figures ── */
.duo{display:grid;grid-template-columns:1fr 1fr;gap:1.5rem;margin-top:1.5rem}
.fig{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:1.4rem 1.5rem 1.2rem}
.fig h3{font-size:1rem;color:var(--navy);margin-bottom:1.1rem}
.vbars{display:flex;align-items:flex-end;gap:1.25rem;height:230px;border-bottom:2px solid var(--navy);padding-bottom:0}
.vbar{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;min-width:0}
.vbar em{font-style:normal;font-weight:800;font-size:.88rem;margin-bottom:.35rem;text-align:center;color:var(--navy)}
.vbar i{display:block;width:100%;max-width:90px;height:var(--h);background:linear-gradient(180deg,var(--bk-2),var(--bk));border-radius:3px 3px 0 0;transform-origin:bottom;transform:scaleY(0);transition:transform .9s cubic-bezier(.2,.7,.2,1)}
.fig.in .vbar i{transform:none}
.vlabels{display:flex;gap:1.25rem;margin-top:.5rem}
.vlabels span{flex:1;text-align:center;font-size:.82rem;color:var(--muted)}
.hbars{display:grid;gap:.9rem}
.hbar{display:grid;grid-template-columns:3.2rem 1fr 5.2rem;gap:.8rem;align-items:center;font-size:.9rem}
.hbar .track{height:18px;background:var(--line-2);border-radius:3px;overflow:hidden}
.hbar i{display:block;height:100%;width:var(--w);background:linear-gradient(90deg,var(--bs),var(--bs-2));transform-origin:left;transform:scaleX(0);transition:transform .9s cubic-bezier(.2,.7,.2,1)}
.fig.in .hbar i{transform:none}
.hbar b{text-align:right;font-variant-numeric:tabular-nums}
.fig .src{margin-top:1rem;font-size:.78rem;color:var(--muted)}

/* ── timeline ── */
.tl{position:relative;margin-top:.5rem}
.tl::before{content:"";position:absolute;left:8.4rem;top:.5rem;bottom:.5rem;width:2px;background:var(--line)}
.tl li{display:grid;grid-template-columns:8.4rem 1fr;gap:0 1.75rem;padding:.6rem 0;position:relative}
.tl .when{text-align:right;font-weight:800;color:var(--navy);padding-top:.7rem;font-variant-numeric:tabular-nums}
.tl .card{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:.9rem 1.15rem}
.tl .card::before{content:"";position:absolute;left:calc(-1.75rem - 6px);top:1.1rem;width:12px;height:12px;border-radius:50%;background:var(--paper);border:3px solid var(--na)}
.tl li[data-s="완료"] .card::before{border-color:var(--ok);background:var(--ok)}
.tl li[data-s="진행"] .card::before{border-color:var(--bk-2);background:var(--bk-2)}
.tl li[data-s="예정"] .card::before{border-color:var(--navy-3)}
.tl .card h3{font-size:1rem;color:var(--ink);display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.tl .card p{color:var(--ink-2);font-size:.92rem;margin-top:.25rem}
.tl .card small{display:block;margin-top:.4rem;color:var(--muted);font-size:.78rem}
.pill{padding:.05rem .55rem;border-radius:999px;font-size:.74rem;font-weight:700;background:var(--na-soft);color:var(--na)}
[data-s="완료"] .pill{background:var(--ok-soft);color:var(--ok)}
[data-s="진행"] .pill{background:var(--bk-soft);color:var(--bk)}
[data-s="예정"] .pill{background:#e3ecfb;color:var(--navy-3)}

/* ── conditions ── */
.meter{display:flex;height:14px;border-radius:999px;overflow:hidden;background:var(--line-2);margin-bottom:.75rem}
.meter i{display:block;transition:width .6s}
.meter i.ok{background:var(--ok)} .meter i.warn{background:#e08a1f} .meter i.na{background:#9aa6ba}
.mkey{display:flex;flex-wrap:wrap;gap:.4rem 1.4rem;font-size:.88rem;color:var(--ink-2);margin-bottom:1.25rem}
.acc details{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);margin-bottom:.6rem;overflow:hidden}
.acc summary{list-style:none;display:flex;align-items:center;gap:.8rem;padding:1rem 1.2rem;cursor:pointer;font-weight:700}
.acc summary::-webkit-details-marker{display:none}
.acc summary .no{font-family:var(--serif);color:var(--navy-3);font-weight:900;min-width:1.6rem}
.acc summary .chip{margin-left:auto}
.acc summary::after{content:"+";font-size:1.4rem;line-height:1;color:var(--muted);margin-left:.4rem}
.acc details[open] summary::after{content:"−"}
.acc details[open] summary{border-bottom:1px solid var(--line-2);background:#fafbfd}
.acc .body{display:grid;grid-template-columns:repeat(3,1fr);gap:1.25rem 1.5rem;padding:1.15rem 1.2rem 1.25rem;font-size:.92rem}
.acc .body h4{font-size:.8rem;color:var(--muted);margin-bottom:.3rem;font-weight:700}
.acc .body small{grid-column:1/-1;color:var(--muted)}

/* ── links ── */
.pips{display:inline-flex;gap:3px;vertical-align:middle;margin-right:.4rem}
.pips i{width:12px;height:12px;border-radius:2px;background:var(--line)}
.pips i.on{background:var(--navy-3)}
.tbl.cols-link .r{grid-template-columns:.9fr 1.6fr 1.6fr .9fr .9fr 1.3fr}
.dir{font-weight:700;color:var(--navy)}
.dir small{display:block;font-weight:500;color:var(--muted)}

/* ── events ── */
.evs{display:grid;grid-template-columns:repeat(2,1fr);gap:1.25rem}
.ev{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;display:flex;flex-direction:column}
.ev h3{padding:1rem 1.25rem;background:var(--navy);color:#fff;font-size:1.02rem}
.ev .pair{display:grid;grid-template-columns:1fr 1fr}
.ev .pair div{padding:1rem 1.25rem;font-size:.9rem;color:var(--ink-2)}
.ev .pair b{display:block;margin-bottom:.35rem;font-size:.82rem;color:var(--ink)}
.ev .bk{background:#fffaf0;border-right:1px solid var(--line-2)}
.ev .bs{background:#f2fbfc}
.ev .caution{padding:.8rem 1.25rem;font-size:.88rem;border-top:1px solid var(--line-2);color:var(--warn);font-weight:600}
.ev small{display:block;padding:0 1.25rem 1rem;color:var(--muted);font-size:.78rem;margin-top:auto}

/* ── appendix ── */
.gloss{display:grid;grid-template-columns:max-content 1fr;gap:.9rem 2rem;background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:1.4rem 1.5rem}
.gloss dt{font-weight:800;color:var(--navy)}
.gloss dd{color:var(--ink-2)}
.srcs{columns:2;column-gap:2rem;counter-reset:s;font-size:.9rem}
.srcs li{break-inside:avoid;padding:.45rem 0;border-bottom:1px solid var(--line-2);display:flex;gap:.6rem}
.srcs li::before{counter-increment:s;content:counter(s);font-weight:800;color:var(--navy-3);min-width:1.5rem;font-variant-numeric:tabular-nums}
.h3s{font-family:var(--serif);font-size:1.25rem;color:var(--navy);margin:2.25rem 0 1rem}
.h3s:first-child{margin-top:0}

footer.foot{background:var(--navy);color:#c4d2ec;padding:48px 0 56px;font-size:.88rem}
footer.foot b{color:#fff}
.totop{position:fixed;right:20px;bottom:20px;z-index:40;width:46px;height:46px;border-radius:50%;border:0;background:var(--navy);color:#fff;font-size:1.2rem;box-shadow:0 6px 18px rgba(10,31,68,.3);opacity:0;pointer-events:none;transition:opacity .25s}
.totop.show{opacity:1;pointer-events:auto}

/* ── responsive ── */
@media(max-width:960px){
  .toc .wrap{grid-template-columns:1fr;gap:2.5rem}
  .duo,.evs{grid-template-columns:1fr}
  .acc .body{grid-template-columns:1fr}
  .srcs{columns:1}
}
@media(max-width:760px){
  .nav .brand{display:none}
  .nav ul{margin-left:0}
  .ch-head{grid-template-columns:1fr}
  .ch-no{border-right:0;border-bottom:3px solid var(--bk-2);padding:0 0 .6rem;width:max-content}
  .tbl .r.h{display:none}
  .tbl .r,.tbl.cols-evt .r,.tbl.cols-link .r{grid-template-columns:1fr;gap:.75rem;padding:1.1rem}
  .tbl .r>*[data-l]::before{content:attr(data-l);display:block;font-size:.74rem;font-weight:700;color:var(--muted);margin-bottom:.1rem}
  .tl::before{left:7px}
  .tl li{grid-template-columns:1fr;padding-left:1.75rem}
  .tl .when{text-align:left;padding:0 0 .25rem}
  .tl .card::before{left:calc(-1.75rem + 1px);top:-.95rem}
  .ev .pair{grid-template-columns:1fr}
  .gloss{grid-template-columns:1fr;gap:.2rem}
  .gloss dd{margin-bottom:.75rem}
  .cover .legend{position:static;padding:0 20px 24px;flex-wrap:wrap}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .vbar i,.hbar i{transition:none;transform:none}
}
@media print{
  .nav,.totop,.skip,.cover svg.rivers{display:none}
  body{background:#fff}
  .cover{min-height:auto;padding:60px 0}
  .chapter{padding-top:32px;break-inside:auto}
  .tbl .r.h{position:static}
  .acc details{display:block}
}
.stats.k6{grid-template-columns:repeat(3,1fr)}
@media(max-width:760px){.stats.k6{grid-template-columns:repeat(2,1fr)}}

</style>

<script>
/* 두 강, 두 랜드마크 — React 보고서 (htm 템플릿, 빌드 과정 없음) */
(function () {
  'use strict';
  const { useState, useEffect, useRef, useMemo } = React;
  const html = htm.bind(React.createElement);
  const D = window.DATA;
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ── helpers ── */
  const fmt = (n) => Number(n).toLocaleString('en-US');
  const RATE = Number(D.fx[0].krw_per_thb);
  const krw100m = (b) => Math.round(Number(b) * RATE);
  const krwText = (v) => {
    const jo = Math.floor(v / 10000), eok = v % 10000;
    return (jo ? jo + '조 ' : '') + (eok ? fmt(eok) + '억' : '') + ' 원';
  };
  const VCLS = { '유사': 'ok', '차별': 'warn', '비교 불가': 'na' };
  const VGLYPH = { '유사': '≈', '차별': '≠', '비교 불가': '?' };
  const SCLS = { '진행 중': 'ok', '구상 단계': 'warn', '과제': 'warn', '확인 필요': 'na' };
  const inv = D.invest.find((r) => r.stage === '2016.3');
  const salesRow = D.sales.find((r) => r.period === '2023~2025');
  const kpi = (m) => D.bexco_kpi.find((r) => r.metric === m);

  const CHAPTERS = [
    { id: 'summary', no: '01', short: '요약', title: '핵심 요약', desc: '무엇이 같고 무엇이 다른지 한눈에' },
    { id: 'projects', no: '02', short: '프로젝트', title: '두 프로젝트 비교', desc: '아이콘시암(방콕)과 신세계 타운(부산) 10개 항목' },
    { id: 'rivers', no: '03', short: '두 강', title: '두 강 비교', desc: '짜오프라야강과 수영강의 닮은 점과 차이 8개 항목' },
    { id: 'numbers', no: '04', short: '숫자', title: '숫자로 보는 흐름', desc: '투자 규모(바트·원화), 매출, 외국인 관광객' },
    { id: 'timeline', no: '05', short: '일정', title: '센텀·수영강 개발 일정', desc: '완료된 일과 앞으로의 일정을 시간순으로' },
    { id: 'musts', no: '06', short: '필수조건', title: '관광단지 필수조건', desc: '신세계 주변이 관광단지가 되려면 필요한 10가지' },
    { id: 'bexco', no: '07', short: '벡스코', title: '벡스코와의 상관관계', desc: '벡스코의 성장이 신세계 타운에 미치는 영향' },
    { id: 'events', no: '08', short: '행사 제안', title: '수영강 행사 방향 제안', desc: '방콕 사례를 부산에 적용한 제안 6가지' },
    { id: 'appendix', no: '부록', short: '부록', title: '용어 풀이와 출처', desc: '전문용어 11개 풀이, 참고 자료 22건' }
  ];

  /* ── hooks ── */
  function useInView(opts) {
    const ref = useRef(null);
    const [seen, setSeen] = useState(reduce);
    useEffect(() => {
      if (seen || !ref.current) return;
      const o = new IntersectionObserver((es) => {
        if (es.some((e) => e.isIntersecting)) { setSeen(true); o.disconnect(); }
      }, opts || { threshold: 0.3 });
      o.observe(ref.current);
      return () => o.disconnect();
    }, [seen]);
    return [ref, seen];
  }
  function useCount(target, active, ms) {
    const [v, setV] = useState(reduce ? target : 0);
    const from = useRef(0);
    useEffect(() => {
      if (!active) return;
      if (reduce) { setV(target); return; }
      const start = from.current, t0 = performance.now(), dur = ms || 1000;
      let raf;
      const step = (t) => {
        const p = Math.min(1, (t - t0) / dur);
        setV(start + (target - start) * (1 - Math.pow(1 - p, 3)));
        if (p < 1) raf = requestAnimationFrame(step); else from.current = target;
      };
      raf = requestAnimationFrame(step);
      return () => cancelAnimationFrame(raf);
    }, [target, active]);
    return Math.round(v);
  }

  /* ── small parts ── */
  function Chip({ cls, children }) { return html`<span className=${'chip ' + cls}>${children}</span>`; }
  function VerdictChip({ v }) {
    return html`<${Chip} cls=${VCLS[v] || 'na'}><span aria-hidden="true">${VGLYPH[v] || '?'}</span>${v}<//>`;
  }
  function Chapter({ c, children, lead }) {
    return html`

          <header className="ch-head">
            <div className="ch-no" aria-hidden="true">${c.no}</div>
            <div>
              <h2 id=${c.id + '-t'}>${c.title}</h2>
              ${lead && html`<p>${lead}</p>`}
            </div>
          </header>
          ${children}
        </div>
      </section>`;
  }
  function Stat({ value, unit, label, cls, active, suffix }) {
    const n = useCount(value, active);
    return html`<div className=${'stat ' + (cls || '')}><b>${fmt(n)}${suffix || ''}<small>${unit}</small></b><span>${label}</span></div>`;
  }

  /* ── nav ── */
  function Nav({ active }) {
    const [show, setShow] = useState(false);
    const [p, setP] = useState(0);
    useEffect(() => {
      const on = () => {
        const y = window.scrollY, h = document.documentElement.scrollHeight - window.innerHeight;
        setShow(y > window.innerHeight * 0.6);
        setP(h > 0 ? (y / h) * 100 : 0);
      };
      on();
      window.addEventListener('scroll', on, { passive: true });
      return () => window.removeEventListener('scroll', on);
    }, []);
    return html`
      <nav className=${'nav' + (show ? ' show' : '')} aria-label="보고서 목차">
        <div className="wrap in">
          <a className="brand" href="#top">두 강, 두 랜드마크</a>

            <li><a href="#toc" aria-current=${active === 'toc'}>목차</a></li>
            ${CHAPTERS.map((c) => html`<li key=${c.id}><a href=${'#' + c.id} aria-current=${active === c.id}>${c.short}</a></li>`)}
          </ul>
        </div>
        <div className="bar" style=${{ '--p': p + '%' }}></div>
      </nav>`;
  }

  /* ── cover ── */
  function Cover() {
    return html`

        <div className="body">

            <div className="rule"></div>
            <dl className="meta">
              <div><dt>분석 기준일</dt><dd>2026년 10월 30일</dd></div>
              <div><dt>환율 기준일</dt><dd>2026년 10월 31일 (1바트 = ${D.fx[0].krw_per_thb}원)</dd></div>
              <div><dt>자료</dt><dd>공개 보도·보도자료 22건</dd></div>
            </dl>
            <a className="go" href="#toc">목차 보기 <span aria-hidden="true">↓</span></a>
          </div>
        </div>
        <svg className="rivers" viewBox="0 0 1600 300" preserveAspectRatio="none" aria-hidden="true">
          <defs>
            <linearGradient id="rg" x1="0" x2="1">
              <stop offset="0" stopColor="#d99200" /><stop offset=".5" stopColor="#3b6fd1" /><stop offset="1" stopColor="#17a2b0" />
            </linearGradient>
          </defs>
          <path className="w1" d="M-80 190 C 200 110, 440 270, 720 190 S 1200 110, 1680 200 L1680 300 L-80 300Z" fill="url(#rg)" opacity=".22" />
          <path className="w2" d="M-80 230 C 240 170, 460 290, 760 230 S 1220 170, 1680 240 L1680 300 L-80 300Z" fill="url(#rg)" opacity=".4" />
        </svg>
        <div className="legend" aria-label="색 안내">
          <span><i className="dot bk"></i>방콕 · 짜오프라야강</span>
          <span><i className="dot bs"></i>부산 · 수영강</span>
        </div>
      </header>`;
  }

  /* ── toc ── */
  function Toc() {
    return html`

            <div className="legendbox">

                <li><${Chip} cls="ok"><span aria-hidden="true">≈</span>유사<//> 두 쪽이 비슷한 항목</li>

                <li><span><i className="dot bk"></i>방콕</span> <span><i className="dot bs"></i>부산</span></li>

              <p className="note">판정·상태·강도·제안은 공개 보도를 읽고 정리한 분석 의견입니다.</p>
            </div>
          </div>
          <ol>
            ${CHAPTERS.map((c) => html`
              <li key=${c.id}>

  /* ── 01 summary ── */
  function Summary() {
    const [ref, seen] = useInView();
    const c = CHAPTERS[0];
    const counts = ['유사', '차별', '비교 불가'].map((v) => ({ v, n: D.comparison.filter((r) => r.verdict === v).length }));
    return html`
      <${Chapter} c=${c} lead="두 프로젝트 모두 쇼핑을 중심으로 호텔·주거·업무를 묶어 도시의 랜드마크를 만들겠다는 점은 같습니다. 다만 방콕은 합작으로 새로 지어 이미 문을 열었고, 부산은 기존 점포를 넓히는 계획이 막 발표된 단계라는 점이 크게 다릅니다.">
        <div ref=${ref}>
          <div className="stats tight">
            ${counts.map((x) => html`<${Stat} key=${x.v} value=${x.n} unit="개" cls=${VCLS[x.v]} label=${x.v + ' 항목 (두 프로젝트 비교 ' + D.comparison.length + '개 중)'} active=${seen} />`)}

            <${Stat} value=${Number(salesRow.sales_trillion)} unit="조원 이상" label="신세계 센텀시티점 연매출(2023~2025, 하한값)" active=${seen} />
            <${Stat} value=${kpi('방문객').value} unit="만 명" label="벡스코 방문객(2025)" active=${seen} />

        <div className="callout"><b>관광단지 조건:</b> 외국인 수요는 빠르게 늘고 있지만, 머무르게 하는 기능(호텔·업무)과 연결하는 기능(동선·교통)은 아직 구상 단계이거나 과제로 남아 있습니다.</div>
        <div className="callout"><b>벡스코와의 관계:</b> 벡스코가 커질수록 신세계 타운이 받을 수요는 늘지만, 호텔·동선·일정이 맞아야 실제 매출로 이어지는 상호 보완 관계입니다.</div>
        <p className="note">기준일 2026-10-30, 공개 보도 기준. 판정은 분석 의견입니다.</p>
      <//>`;
  }

  /* ── 02 / 03 comparison tables ── */
  function CompareTable({ rows, lname, rname, lkey, rkey, filterable }) {
    const [f, setF] = useState('');
    const shown = rows.filter((r) => !f || r.verdict === f);
    const cnt = (v) => rows.filter((r) => r.verdict === v).length;
    return html`
      <div>
        ${filterable && html`
          <div className="toolbar">
            <div className="seg" role="group" aria-label="판정 필터">
              ${[['', '전체 ' + rows.length], ['유사', '유사 ' + cnt('유사')], ['차별', '차별 ' + cnt('차별')], ['비교 불가', '비교 불가 ' + cnt('비교 불가')]].map(([v, t]) => html`
                <button key=${v} type="button" aria-pressed=${f === v} onClick=${() => setF(v)}>${t}</button>`)}
            </div>
            <span className="count" aria-live="polite">${shown.length}개 항목</span>
          </div>`}
        <div className="tbl" role="table">
          <div className="r h" role="row">
            <span role="columnheader">구분</span>
            <span className="bk" role="columnheader">${lname}</span>
            <span className="bs" role="columnheader">${rname}</span>
            <span role="columnheader">판정</span>
            <span role="columnheader">해석</span>
          </div>
          ${shown.length === 0 && html`<p className="empty">이 판정에 해당하는 항목이 없습니다.</p>`}
          ${shown.map((r) => html`
            <div className="r" role="row" key=${r.dimension}>
              <div className="dim" role="cell">${r.dimension}</div>
              <div className="c-bk" role="cell" data-l=${lname}>${r[lkey]}</div>
              <div className="c-bs" role="cell" data-l=${rname}>${r[rkey]}</div>
              <div role="cell" data-l="판정"><${VerdictChip} v=${r.verdict} /></div>
              <div className="why" role="cell" data-l="해석">${r.note}<span className="src">출처: ${r.src}</span></div>
            </div>`)}
        </div>
      </div>`;
  }

  /* ── 04 numbers ── */
  function Numbers() {
    const [unit, setUnit] = useState('thb');
    const [figRef, seen] = useInView({ threshold: 0.25 });
    const maxI = Math.max(...D.invest.map((r) => Number(r.baht_100m)));
    const maxT = Math.max(...D.tourists.map((r) => r.visitors));
    const v = unit === 'thb' ? Number(inv.baht_100m) : krw100m(inv.baht_100m);
    const big = useCount(v, seen, 800);
    return html`
      <${Chapter} c=${CHAPTERS[3]} lead="투자 규모는 바트와 원화를 바꿔 볼 수 있습니다. 원화는 2026년 10월 31일 환율로 환산한 값입니다.">
        <div className="seg" role="group" aria-label="통화 선택">
          <button type="button" aria-pressed=${unit === 'thb'} onClick=${() => setUnit('thb')}>바트</button>
          <button type="button" aria-pressed=${unit === 'krw'} onClick=${() => setUnit('krw')}>원화</button>
        </div>
        <div className="stats" ref=${figRef}>
          <div className="stat"><b>${unit === 'thb' ? fmt(big) : krwText(big).replace(' 원', '')}<small>${unit === 'thb' ? '억 바트' : '원'}</small></b><span>아이콘시암 총 투자(2016.3 기준)</span></div>
          <${Stat} value=${Number(salesRow.sales_trillion)} unit="조원 이상" label="신세계 센텀시티점 연매출(2023~2025, 하한값)" active=${seen} />
        </div>
        <p className="note">환율 1바트 = ${D.fx[0].krw_per_thb}원(${D.fx[0].as_of} 기준, ${D.fx[0].note}). 당시 환율이 아니라 현재 환율로 환산한 값입니다.</p>
        <div className=${'duo'}>
          <figure className=${'fig' + (seen ? ' in' : '')}>
            <h3>아이콘시암 총 투자액이 커진 과정 (${unit === 'thb' ? '억 바트' : '원화 환산'})</h3>
            <div className="vbars">
              ${D.invest.map((r) => html`
                <div className="vbar" key=${r.stage}>
                  <em>${unit === 'thb' ? fmt(r.baht_100m) + '억 바트' : krwText(krw100m(r.baht_100m))}</em>
                  <i style=${{ '--h': (Number(r.baht_100m) / maxI * 100).toFixed(1) + '%' }}></i>
                </div>`)}
            </div>
            <div className="vlabels">${D.invest.map((r) => html`<span key=${r.stage}>${r.stage}</span>`)}</div>
            <p className="src">출처: ${D.invest.map((r) => r.stage + ' ' + r.src).join(' / ')}</p>
          </figure>
          <figure className=${'fig' + (seen ? ' in' : '')}>
            <h3>부산 외국인 관광객 국적별 (2026년 1~5월, 명)</h3>
            <div className="hbars">
              ${D.tourists.map((r) => html`
                <div className="hbar" key=${r.country}>
                  <span>${r.country}</span>
                  <span className="track"><i style=${{ '--w': (r.visitors / maxT * 100).toFixed(1) + '%' }}></i></span>
                  <b>${fmt(r.visitors)}</b>
                </div>`)}
            </div>
            <p className="src">출처: ${D.tourists[0].src}</p>
          </figure>
        </div>
        <p className="note">두 차트는 통화와 지표가 달라 서로 견줄 수 없습니다. 신세계의 인수 금액과 C부지 투자액은 공개되지 않았습니다. 센텀시티점 매출은 '2조원 이상'으로 발표된 값이라 하한선입니다. 같은 시기 investing.com은 약 39.76원으로 표시해 0.7% 정도 차이가 납니다.</p>
      <//>`;
  }

  /* ── 05 timeline ── */
  function Timeline() {
    const [f, setF] = useState('');
    const list = D.timeline.filter((r) => !f || (f === 'past' ? ['완료', '진행'].includes(r.status) : ['예정', '미정'].includes(r.status)));
    return html`
      <${Chapter} c=${CHAPTERS[4]} lead="완료와 예정을 시간순으로 정리했습니다. 신세계 C부지와 롯데점 리뉴얼은 일정이 공개되지 않았습니다.">
        <div className="seg" role="group" aria-label="일정 필터">
          ${[['', '전체'], ['past', '완료·진행'], ['future', '예정·미정']].map(([v, t]) => html`<button key=${v} type="button" aria-pressed=${f === v} onClick=${() => setF(v)}>${t}</button>`)}
        </div>
        <ol className="tl">
          ${list.map((r) => html`
            <li key=${r.when + r.item} data-s=${r.status}>
              <div className="when">${r.when}</div>
              <div className="card">
                <h3>${r.item}<span className="pill">${r.status}</span></h3>
                <p>${r.detail}</p>
                <small>출처: ${r.src}</small>
              </div>
            </li>`)}
        </ol>
      <//>`;
  }

  /* ── 06 musts ── */
  function Musts() {
    const counts = { ok: 0, warn: 0, na: 0 };
    D.conditions.forEach((c) => { counts[SCLS[c.status] || 'na']++; });
    const total = D.conditions.length;
    return html`
      <${Chapter} c=${CHAPTERS[5]} lead="공개 보도를 근거로 정리한 분석 의견입니다. 항목을 눌러 이유·근거·제안을 확인하세요.">
        <div className="meter" role="img" aria-label=${'필수조건 ' + total + '개 중 진행 중 ' + counts.ok + '개, 구상 단계·과제 ' + counts.warn + '개, 확인 필요 ' + counts.na + '개'}>
          ${['ok', 'warn', 'na'].map((k) => counts[k] > 0 && html`<i key=${k} className=${k} style=${{ width: counts[k] / total * 100 + '%' }}></i>`)}
        </div>
        <ul className="mkey">
          <li><i className="dot ok"></i>진행 중 ${counts.ok}개</li>
          <li><i className="dot warn"></i>구상 단계·과제 ${counts.warn}개</li>
          <li><i className="dot na"></i>확인 필요 ${counts.na}개</li>
        </ul>
        <div className="acc">
          ${D.conditions.map((c, i) => html`
            <details key=${c.condition}>
              <summary><span className="no">${i + 1}</span>${c.condition}<${Chip} cls=${SCLS[c.status] || 'na'}>${c.status}<//></summary>
              <div className="body">
                <div><h4>왜 필요한가</h4><p>${c.why}</p></div>
                <div><h4>현재 근거</h4><p>${c.evidence}</p></div>
                <div><h4>제안</h4><p>${c.action}</p></div>
                <small>출처: ${c.src}</small>
              </div>
            </details>`)}
        </div>
        <div className="callout"><b>한 줄 결론:</b> 외국인 수요는 빠르게 늘고 있지만, 머무르게 하는 기능(호텔·업무)과 연결하는 기능(동선·교통)은 아직 구상 단계이거나 과제로 남아 있습니다.</div>
        <div className="callout priority"><b>우선순위 제안:</b> 머무름(숙박·업무)과 연결(동선·교통)을 먼저 확정하고, 콘텐츠·행사·수변 연계는 그 위에 얹는 순서가 안전합니다.</div>
        <p className="note"><b>상태 읽는 법:</b> 진행 중은 사업·정책이 실제로 움직이는 것, 구상 단계·과제는 방향만 있거나 해결이 필요한 것, 확인 필요는 자료가 부족한 것입니다. 계획이 구체적으로 공개되면 달라질 수 있습니다.</p>
      <//>`;
  }

  /* ── 07 bexco ── */
  function Bexco() {
    const [ref, seen] = useInView();
    const pips = { '강': 3, '중': 2, '확인 불가': 0 };
    return html`
      <${Chapter} c=${CHAPTERS[6]} lead="통계적 상관 분석이 아니라, 두 사업이 서로의 수요·약점을 어떻게 받쳐 주는지 구조로 본 분석 의견입니다. 벡스코 방문객이 신세계를 실제로 얼마나 이용하는지는 공개 자료가 없어 확인하지 못했습니다.">
        <div className="stats k6 tight" ref=${ref}>
          ${D.bexco_kpi.map((k) => html`<${Stat} key=${k.metric} value=${k.value} unit=${k.unit} label=${'벡스코 ' + k.metric + ' · ' + k.period + ' · ' + k.src} active=${seen} />`)}
        </div>
        <div className="tbl cols-link" role="table">
          <div className="r h" role="row">
            <span>연결고리</span><span className="bk">벡스코</span><span className="bs">신세계 타운</span><span>방향</span><span>강도</span><span>해석</span>
          </div>
          ${D.bexco_links.map((l) => html`
            <div className="r" role="row" key=${l.link}>
              <div className="dim" role="cell">${l.link}</div>
              <div className="c-bk" role="cell" data-l="벡스코">${l.bexco}</div>
              <div className="c-bs" role="cell" data-l="신세계 타운">${l.shinsegae}</div>
              <div className="dir" role="cell" data-l="방향">${l.direction}</div>
              <div role="cell" data-l="강도"><span className="pips" role="img" aria-label=${'영향 강도 ' + l.strength}>${[0, 1, 2].map((n) => html`<i key=${n} className=${n < (pips[l.strength] || 0) ? 'on' : ''}></i>`)}</span>${l.strength}</div>
              <div className="why" role="cell" data-l="해석">${l.note}<span className="src">출처: ${l.src}</span></div>
            </div>`)}
        </div>
        <p className="note">'강도'는 두 사업이 서로에게 미치는 영향의 크기에 대한 판단입니다(칸 3개=강, 2개=중, 0개=확인 불가). 방향은 영향이 흐르는 쪽입니다.</p>
      <//>`;
  }

  /* ── 08 events ── */
  function Events() {
    return html`
      <${Chapter} c=${CHAPTERS[7]} lead="공개 자료의 사례와 일정을 바탕으로 한 분석 의견이며, 확정된 계획이 아닙니다. 벤치마크는 아이콘시암 사례를 뜻합니다.">
        <div className="evs">
          ${D.events.map((e) => html`
            <article className="ev" key=${e.direction}>
              <h3>${e.direction}</h3>
              <div className="pair">
                <div className="bk"><b><i className="dot bk"></i>방콕 사례</b>${e.benchmark}</div>
                <div className="bs"><b><i className="dot bs"></i>부산 적용안</b>${e.busan}</div>
              </div>
              <p className="caution">주의: ${e.caution}</p>
              <small>근거: ${e.basis}</small>
            </article>`)}
        </div>
      <//>`;
  }

  /* ── appendix ── */
  function Appendix() {
    return html`
      <${Chapter} c=${CHAPTERS[8]}>
        <h3 className="h3s">용어 풀이</h3>
        <dl className="gloss">
          ${D.glossary.map((g) => html`<${React.Fragment} key=${g.term}><dt>${g.term}</dt><dd>${g.def}</dd><//>`)}
        </dl>
        <h3 className="h3s">출처</h3>
        <ol className="srcs">
          ${D.sources.map((s) => html`<li key=${s.url}><a href=${s.url} target="_blank" rel="noopener noreferrer">${s.title}</a></li>`)}
        </ol>
      <//>`;
  }

  /* ── app ── */
  function App() {
    const [active, setActive] = useState('');
    const [top, setTop] = useState(false);
    useEffect(() => {
      const ids = ['toc', ...CHAPTERS.map((c) => c.id)];
      const vis = new Map();
      const o = new IntersectionObserver((es) => {
        es.forEach((e) => vis.set(e.target.id, e.isIntersecting ? e.intersectionRatio : 0));
        let best = '', r = 0;
        ids.forEach((id) => { if ((vis.get(id) || 0) > r) { r = vis.get(id); best = id; } });
        setActive(best);
      }, { rootMargin: '-35% 0px -45% 0px', threshold: [0, 0.01, 0.1, 0.5] });
      ids.forEach((id) => { const el = document.getElementById(id); if (el) o.observe(el); });
      const sc = () => setTop(window.scrollY > 900);
      window.addEventListener('scroll', sc, { passive: true });
      return () => { o.disconnect(); window.removeEventListener('scroll', sc); };
    }, []);
    const proj = D.comparison.map((r) => ({ ...r, l: r.iconsiam, r: r.shinsegae }));
    return html`
      <${React.Fragment}>
        <${Nav} active=${active} />
        <${Cover} />
        <${Toc} />
        <main id="main">
          <${Summary} />
          <${Chapter} c=${CHAPTERS[1]} lead="'판정'은 공개 자료를 읽고 정리한 분석 의견입니다. 확인하지 못한 항목은 '비교 불가'로 두었습니다.">
            <${CompareTable} rows=${D.comparison} lname="아이콘시암 (방콕)" rname="신세계 타운 (부산)" lkey="iconsiam" rkey="shinsegae" filterable=${true} />
          <//>
          <${Chapter} c=${CHAPTERS[2]} lead="'수영천'은 센텀시티 옆을 흐르는 수영강을 가리키는 것으로 보고 정리했습니다. 두 강의 길이·유량 같은 자연 지표는 확인하지 못해 비교하지 않았습니다.">
            <${CompareTable} rows=${D.river} lname="짜오프라야강 (방콕)" rname="수영강 (부산)" lkey="chaophraya" rkey="suyeong" filterable=${true} />
          <//>
          <${Numbers} />
          <${Timeline} />
          <${Musts} />
          <${Bexco} />
          <${Events} />
          <${Appendix} />
        </main>
        <footer className="foot">
          <div className="wrap">
            <p><b>두 강, 두 랜드마크</b> — 아이콘시암과 부산 신세계 타운 비교 보고서</p>
            <p>2026년 10월 31일 기준 공개 보도와 보도자료를 정리한 분석입니다. 판정·상태·강도·제안은 분석 의견이며, 투자 금액의 원화는 현재 환율로 환산한 값입니다.</p>
          </div>
        </footer>
        <button type="button" className=${'totop' + (top ? ' show' : '')} aria-label="맨 위로" onClick=${() => window.scrollTo({ top: 0, behavior: reduce ? 'auto' : 'smooth' })}>↑</button>
      <//>`;
  }

  ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
})();

</script>
</body>
</html>
